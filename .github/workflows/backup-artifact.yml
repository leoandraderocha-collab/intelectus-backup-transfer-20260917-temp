name: Intelectus Encrypted Backup Transfer
on:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload encrypted official backup
        uses: actions/upload-artifact@v4
        with:
          name: Intelectus_Aplicativos_Oficiais_2026-09-17_ENCRYPTED
          path: |
            intelectus-apps-official-20260917.tar.gz.enc
            SHA256SUMS.txt
            RECOVERY.txt
          retention-days: 1
          compression-level: 0
